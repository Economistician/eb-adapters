######################################
# Project metadata
######################################
[project]
name = "eb-adapters"
version = "0.2.5"
description = "Adapter layer for third-party forecasting libraries in Electric Barometer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]

######################################
# Core runtime dependencies
######################################
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",

  # Electric Barometer System Release 0.2.10 pins
  "eb-metrics==0.2.9",
  "eb-contracts==0.2.3",
]

######################################
# Optional dependencies (extras)
######################################
[project.optional-dependencies]

# Framework integrations
prophet = ["prophet>=1.1"]
statsmodels = ["statsmodels>=0.14"]
catboost = ["catboost>=1.2"]
# Added scikit-learn as it is required for LightGBM's sklearn-compatible wrappers
lightgbm = ["lightgbm>=4.0", "scikit-learn"]
xgboost = ["xgboost>=2.0"]

# CI / test-only dependencies (required by the hub typecheck gate extras: test)
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

# Local developer tooling
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy",
  "ruff",
]

# Combined extra including all framework integrations and development tools.
# Useful for full local testing or comprehensive CI environments.
#
# NOTE:
# Avoid self-referential extras like "eb-adapters[prophet,...]" inside optional-dependencies.
# Instead, define "all" as the explicit union of the desired requirements.
all = [
  # Framework integrations
  "prophet>=1.1",
  "statsmodels>=0.14",
  "catboost>=1.2",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "scikit-learn",

  # Test + developer tooling
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy",
  "ruff",
]

######################################
# Build system
######################################
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

######################################
# Package discovery
######################################
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eb_adapters = ["py.typed"]
